<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsung Disclaimer Finder</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8f9fa;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function SamsungDisclaimerFinder() {
      const [feature, setFeature] = React.useState('');
      const [results, setResults] = React.useState([]);
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState('');

      const extractJSON = (text) => {
        // { 부터 } 까지의 JSON 객체 추출
        const jsonMatch = text.match(/\{[\s\S]*\}/);
        if (!jsonMatch) {
          return null;
        }
        return jsonMatch[0];
      };

      const searchDisclaimers = async () => {
        if (!feature.trim()) {
          setError('검색할 기능을 입력해주세요.');
          return;
        }

        setLoading(true);
        setError('');
        setResults([]);

        try {
          // 백엔드 API 호출
          const response = await fetch('/api/search', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ feature: feature.trim() })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || '검색 중 오류가 발생했습니다');
          }

          if (!data.disclaimers || !Array.isArray(data.disclaimers)) {
            throw new Error('잘못된 응답 형식');
          }

          setResults(data.disclaimers);
          if (data.disclaimers.length === 0) {
            setError(`"${feature}"와 관련된 디스클레이머를 찾을 수 없습니다.`);
          }
        } catch (err) {
          console.error('Search error:', err);
          setError(`검색 중 오류가 발생했습니다: ${err.message}`);
          setResults([]);
        } finally {
          setLoading(false);
        }
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter' && !loading) {
          searchDisclaimers();
        }
      };

      return (
        <div style={{ minHeight: '100vh', background: '#f8f9fa' }}>
          {/* Header */}
          <div style={{
            background: 'linear-gradient(135deg, #1428A0 0%, #0d1f5f 100%)',
            color: 'white',
            padding: '40px 20px',
            textAlign: 'center'
          }}>
            <h1 style={{
              margin: '0 0 8px 0',
              fontSize: '32px',
              fontWeight: '600',
              letterSpacing: '-0.5px'
            }}>
              Samsung Disclaimer Finder
            </h1>
            <p style={{
              margin: '0',
              fontSize: '14px',
              opacity: 0.9,
              fontWeight: '400'
            }}>
              UK 및 US 삼성닷컴의 디스클레이머를 검색합니다
            </p>
          </div>

          {/* Search Section */}
          <div style={{ padding: '40px 20px', maxWidth: '900px', margin: '0 auto' }}>
            <div style={{
              display: 'flex',
              gap: '12px',
              marginBottom: '32px',
              flexWrap: 'wrap'
            }}>
              <input
                type="text"
                value={feature}
                onChange={(e) => setFeature(e.target.value)}
                onKeyPress={handleKeyPress}
                placeholder="검색할 기능을 입력하세요 (예: 5G, Battery, Camera, AI)"
                disabled={loading}
                style={{
                  flex: 1,
                  minWidth: '250px',
                  padding: '12px 16px',
                  fontSize: '14px',
                  border: '1px solid #ddd',
                  borderRadius: '6px',
                  fontFamily: 'inherit',
                  outline: 'none',
                  transition: 'border-color 0.2s',
                  opacity: loading ? 0.6 : 1,
                  cursor: loading ? 'not-allowed' : 'text'
                }}
                onFocus={(e) => {
                  e.target.style.borderColor = '#1428A0';
                  e.target.style.boxShadow = '0 0 0 2px rgba(20, 40, 160, 0.1)';
                }}
                onBlur={(e) => {
                  e.target.style.borderColor = '#ddd';
                  e.target.style.boxShadow = 'none';
                }}
              />
              <button
                onClick={searchDisclaimers}
                disabled={loading}
                style={{
                  padding: '12px 24px',
                  background: loading ? '#ccc' : '#1428A0',
                  color: 'white',
                  border: 'none',
                  borderRadius: '6px',
                  fontSize: '14px',
                  fontWeight: '500',
                  cursor: loading ? 'not-allowed' : 'pointer',
                  transition: 'background 0.2s',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '8px',
                  whiteSpace: 'nowrap'
                }}
                onMouseEnter={(e) => {
                  if (!loading) e.target.style.background = '#0d1f5f';
                }}
                onMouseLeave={(e) => {
                  if (!loading) e.target.style.background = '#1428A0';
                }}
              >
                {loading && (
                  <span style={{
                    display: 'inline-block',
                    width: '16px',
                    height: '16px',
                    border: '2px solid rgba(255,255,255,.3)',
                    borderTop: '2px solid white',
                    borderRadius: '50%',
                    animation: 'spin 1s linear infinite'
                  }} />
                )}
                {loading ? '검색 중...' : '검색'}
              </button>
            </div>

            {/* Error Message */}
            {error && (
              <div style={{
                padding: '16px',
                background: '#fef2f2',
                border: '1px solid #fecaca',
                borderRadius: '6px',
                color: '#991b1b',
                fontSize: '14px',
                marginBottom: '24px'
              }}>
                {error}
              </div>
            )}

            {/* Results */}
            {results.length > 0 && (
              <div>
                <div style={{
                  marginBottom: '20px',
                  fontSize: '14px',
                  color: '#666',
                  fontWeight: '500'
                }}>
                  {results.length}개의 결과 찾음
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  {results.map((result, idx) => (
                    <div
                      key={idx}
                      style={{
                        background: 'white',
                        border: '1px solid #e5e7eb',
                        borderRadius: '8px',
                        padding: '20px',
                        boxShadow: '0 1px 3px rgba(0,0,0,0.05)'
                      }}
                    >
                      <div style={{
                        display: 'flex',
                        gap: '16px',
                        alignItems: 'flex-start',
                        marginBottom: '12px',
                        flexWrap: 'wrap'
                      }}>
                        <span style={{
                          display: 'inline-block',
                          padding: '4px 12px',
                          background: result.country === 'UK' ? '#dbeafe' : '#fef3c7',
                          color: result.country === 'UK' ? '#1e40af' : '#92400e',
                          borderRadius: '4px',
                          fontSize: '12px',
                          fontWeight: '600',
                          textTransform: 'uppercase'
                        }}>
                          {result.country}
                        </span>
                        <span style={{
                          padding: '4px 12px',
                          background: '#f3f4f6',
                          borderRadius: '4px',
                          fontSize: '12px',
                          color: '#374151'
                        }}>
                          {result.releaseYear}
                        </span>
                      </div>
                      
                      <h3 style={{
                        margin: '0 0 12px 0',
                        fontSize: '16px',
                        fontWeight: '600',
                        color: '#111'
                      }}>
                        {result.productName}
                      </h3>
                      
                      <p style={{
                        margin: '0',
                        fontSize: '14px',
                        lineHeight: '1.6',
                        color: '#4b5563',
                        whiteSpace: 'pre-wrap',
                        wordBreak: 'break-word'
                      }}>
                        {result.disclaimer}
                      </p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Empty State */}
            {!loading && results.length === 0 && !error && (
              <div style={{
                textAlign: 'center',
                padding: '60px 20px',
                color: '#9ca3af'
              }}>
                <div style={{ fontSize: '48px', marginBottom: '16px' }}>📋</div>
                <p style={{
                  margin: '0',
                  fontSize: '14px',
                  color: '#6b7280'
                }}>
                  검색할 기능을 입력하고 [검색]을 클릭하세요
                </p>
              </div>
            )}
          </div>

          <style>{`
            @keyframes spin {
              from { transform: rotate(0deg); }
              to { transform: rotate(360deg); }
            }
          `}</style>
        </div>
      );
    }

    // 앱 렌더링
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SamsungDisclaimerFinder />);
  </script>
</body>
</html>
